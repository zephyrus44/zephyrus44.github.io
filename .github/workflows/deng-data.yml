name: Update Deng's Den data

on:
  schedule:
    - cron: "17 12 * * *"   # once a day, 12:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        run: |
          set -euo pipefail
          mkdir -p data/history
          UA="Mozilla/5.0 (era-grouping tool; one request per day)"
          curl -fsS -A "$UA" https://dengsden.com/avatar/api/servers -o /tmp/servers.json
          curl -fsS -A "$UA" https://dengsden.com/avatar/api/svs     -o /tmp/svs.json
          # Only keep the files if they parsed as JSON
          jq -e '.rows | length > 0'   /tmp/servers.json > /dev/null
          jq -e '.worlds | type == "array"' /tmp/svs.json > /dev/null
          cp /tmp/servers.json data/deng-servers.json
          cp /tmp/svs.json     data/deng-svs.json
          # Small daily history (top-100 power per world)
          DAY=$(jq -r '.taken_at[0:10]' /tmp/servers.json)
          jq -c '{taken_at, top100: (.rows | map({key: (.server|tostring), value: (.top100_sum|tonumber)}) | from_entries)}' \
            /tmp/servers.json > "data/history/servers-$DAY.json"
          # Upper Ring (vanguard) worlds, picked by the game when each migration event opens
          if curl -fsS -A "$UA" https://dengsden.com/avatar/api/migration/vanguard -o /tmp/vanguard.json \
             && jq -e '.upperNow.worlds | type == "array"' /tmp/vanguard.json > /dev/null; then
            # Keep every past pick in "history" so each round keeps its own Vanguard list
            [ -f data/deng-vanguard.json ] || echo '{}' > data/deng-vanguard.json
            jq --slurpfile old data/deng-vanguard.json '
              .picks as $n | (.upperNow.worlds | map(. + 1000) | sort) as $now |
              {picked: .upperNow.picked, worlds: $now,
               next: {event: .event.start, as_of: .asOf,
                      worlds: ([.worlds[] | select(.place <= $n)] | sort_by(.place) | map(.s + 1000))},
               history: (($old[0].history // {}) + {(.upperNow.picked): $now})}' \
              /tmp/vanguard.json > /tmp/vanguard-out.json
            mv /tmp/vanguard-out.json data/deng-vanguard.json
          fi
          # Keep each round's actual warzones once they appear
          START=$(jq -r '.start // empty | todate | .[0:10]' /tmp/svs.json)
          if [ -n "$START" ] && [ "$(jq '.worlds | length' /tmp/svs.json)" -gt 0 ]; then
            cp /tmp/svs.json "data/history/svs-$START.json"
          fi

      - name: Migration tickets and player power
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (ARC Tools; once a day)"
          # Tickets needed by highest power
          if curl -fsS -A "$UA" https://dengsden.com/avatar/api/migration -o /tmp/migration.json \
             && jq -e '.tickets | length > 0' /tmp/migration.json > /dev/null; then
            jq -c '{tickets: [.tickets[] | {from, tickets}]}' /tmp/migration.json > data/deng-tickets.json
          fi
          # Top 100 players by power on each world (name, alliance tag, power), for the ticket calculator
          mkdir -p data/players
          for s in $(jq -r '.rows[].server' data/deng-servers.json); do
            rows='[]'; ok=1
            for page in 0 1; do
              if curl -fsS -A "$UA" "https://dengsden.com/avatar/api/board?board=power&server=$s&page=$page" -o /tmp/board.json \
                 && jq -e '.rows | type == "array"' /tmp/board.json > /dev/null; then
                rows=$(jq -c --argjson acc "$rows" '$acc + .rows' /tmp/board.json)
              else ok=0; fi
              sleep 0.5
            done
            [ "$ok" = 1 ] || continue
            echo "$rows" | jq -c '{as_of: (.[0].refreshed // null),
              players: map([(.name | sub("^\\[[^]]*\\] ?"; "")), (.ally_tag // ""), (.value | tonumber)])}' \
              > "data/players/$((1000 + s)).json"
          done

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update Deng's Den data"
          git push
