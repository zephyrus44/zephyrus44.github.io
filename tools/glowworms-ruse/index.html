<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowworm's Ruse Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/theme.css">
<script src="/nav.js" data-title="Glowworm&#39;s Ruse" data-accent="#50B080" defer></script>
<style>
/* Layout: control rail on the left, full-bleed pannable map on the right; stacks on phones */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#dfe2e8; --line-strong:#c5cad4;
  --fg:#161a22; --muted:#626a7a; --accent:#2f5fd0; --accent-soft:#e7edfb;
  --map-bg:#e9e6df; --tile:#f6f3ec; --tile-line:#8f8676; --void:#cfc8bb;
  --danger:#c2412d; --ok:#1d8a50; --ok-soft:#dcf3e6; --warn:#a86400; --warn-soft:#fbecd2;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#171a20; --line:#262a33; --line-strong:#353b47;
  --fg:#e8eaef; --muted:#8d95a5; --accent:#7ea0ff; --accent-soft:#1d2640;
  --map-bg:#14161a; --tile:#2a2823; --tile-line:#6d6658; --void:#1b1b1a; --danger:#ff7a63; --ok:#5fd394; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --line:#262a33; --line-strong:#353b47;
  --fg:#e8eaef; --muted:#8d95a5; --accent:#7ea0ff; --accent-soft:#1d2640;
  --map-bg:#14161a; --tile:#2a2823; --tile-line:#6d6658; --void:#1b1b1a; --danger:#ff7a63; --ok:#5fd394; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2a12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:350px minmax(0,1fr);gap:12px;height:100%}
.rail{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:11px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1.3fr 1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evdate{border:1px solid var(--line-strong);background:var(--bg);border-radius:7px;padding:5px 8px;font-size:13px;color-scheme:light dark;flex:1;min-width:0}
.evdate:focus{outline:none;border-color:var(--accent)}
.evtag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.evtag.set{color:var(--accent);border-color:var(--accent)}
.evgrid{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.ph{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:6px}
.ph i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.ph .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph.past{opacity:.55}.ph.now{background:var(--accent-soft)}.ph.now i{background:var(--accent)}.ph.now b{color:var(--accent)}
.evsub{color:var(--muted);font-size:12px;padding:2px 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alli{display:flex;flex-direction:column;gap:4px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.al:hover{background:var(--bg)}
.al.on{border-color:var(--line-strong);background:var(--bg)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;padding:0}
.al input{border:0;background:transparent;font-weight:600;padding:0;min-width:0;width:100%}
.al input:focus{outline:none;border-bottom:1px solid var(--accent)}
.al .pts{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.al .pts small{display:block;color:var(--muted);font-size:11px}
.al .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.al .bar i{display:block;height:100%}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:6px 0 2px}
.swatches button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;color:var(--muted);font-size:12.5px;line-height:1.45}
.types{display:flex;flex-direction:column;gap:4px}
.zh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.ty .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ty{display:grid;grid-template-columns:auto minmax(0,1fr) 72px 30px;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.ty.sel{border-color:var(--accent);background:var(--accent-soft)}
.ty input[type=text]{border:0;background:transparent;font-weight:600;min-width:0;width:100%;padding:2px 0}
.ty input[type=number]{width:64px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel);font-family:var(--f-mono);font-size:12px;text-align:right}
.ty .cnt{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:28px;text-align:right}
.mk{width:14px;height:14px;display:inline-block;cursor:pointer;border:0;padding:0}
.stage{position:relative;min-height:0;background:var(--map-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:30px 1fr;grid-template-rows:24px 1fr}
.corner{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
canvas.ruler{display:block;width:100%;height:100%;background:var(--panel)}
#rx{border-bottom:1px solid var(--line)} #ry{border-right:1px solid var(--line)}
.mapwrap{position:relative;overflow:hidden;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.terr{fill:var(--tile);stroke:var(--tile-line);stroke-width:.45;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.terr.own{stroke:rgba(0,0,0,.55)}
.terr:hover{stroke:var(--fg);stroke-width:1.6}
.bgon .terr{fill-opacity:.0}
.bgon .terr.own{fill-opacity:.62}
.gate{cursor:pointer}
.gate:hover rect{stroke-width:2.2}
.hud{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.hud button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:17px;font-weight:600;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 70px)}
.legend label{display:flex;gap:6px;align-items:center;cursor:pointer}
.legend input[type=range]{width:80px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:170px;z-index:5}
.tip b{font-size:13px}
.tip .k{color:var(--muted)}
.modebar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-family:var(--f-mono);font-size:11.5px;resize:vertical}
.note{font-size:12px;color:var(--muted)}
.ok{color:var(--accent);font-weight:600;font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.goals{display:flex;flex-direction:column;gap:4px}
.goal{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;background:transparent;width:100%}
.goal:hover{background:var(--bg)}
.goal.sel{border-color:var(--accent);background:var(--accent-soft)}
.goal .ch{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:center}
.goal .tt{font-weight:600;font-size:13px;line-height:1.3}
.goal .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.goal.done .tt{color:var(--muted)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-live{background:var(--accent);color:#fff}
.p-next{background:var(--accent-soft);color:var(--accent)}
.p-up{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.p-open{background:var(--warn-soft);color:var(--warn)}
.step{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px}
.step button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;line-height:1;padding:0}
.detail{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.detail .row{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg);font-size:13px;font-weight:600;width:100%}
.input:focus,#phNotes:focus{outline:none;border-color:var(--accent)}
#phNotes{min-height:64px;font-family:inherit;font-size:12.5px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.phstep{display:flex;align-items:center;gap:4px;border-left:1px solid var(--line);padding-left:10px}
.phstep button{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;width:24px;height:24px;font-size:11px;cursor:pointer;padding:0;color:var(--fg)}
.phstep button[disabled]{opacity:.35;cursor:default}
.phstep b{color:var(--fg);font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gh{opacity:.3;pointer-events:none}

.tg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tg b{color:var(--fg);font-family:var(--f-mono)}
.key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:12px}
.key span{display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.key i.g{border-radius:2px;transform:rotate(45deg) scale(.85)}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
.dim .terr:not(.elig){opacity:.55}
.dtools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;pointer-events:none;z-index:4}
.dgrp{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.16);pointer-events:auto}
.dgrp button{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--fg);cursor:pointer}
.dgrp button:hover{background:var(--bg)}
.dgrp button[aria-pressed="true"]{background:var(--accent);color:#fff}
.dgrp svg{width:16px;height:16px;fill:currentColor;stroke:currentColor}
.dgrp .sw{width:20px;height:20px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.dgrp .sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px;background-clip:padding-box}
.dhint{width:100%;text-align:center;font-size:11.5px;color:var(--fg);pointer-events:none}
.dhint span{display:inline-block;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 10px;line-height:1.4}
@media (max-width:600px){.dhint .pan{display:none}}
.mapwrap.drawing{cursor:crosshair}
#dl text{font-family:var(--f-ui);font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.75);stroke-linejoin:round}
@media (max-width:600px){.dgrp [data-tool] span{display:none}.dgrp [data-tool]{padding:6px 7px}.dtools{left:6px;right:6px}}
.mk-dim{opacity:.25}
.dgrp .sep{width:1px;align-self:stretch;background:var(--line-strong);margin:3px 3px}
.dgrp svg.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hud .snapbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.snapmenu{position:absolute;right:calc(52px + env(safe-area-inset-right,0px));bottom:10px;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:3px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 12px rgba(0,0,0,.16);z-index:6;min-width:170px}
.snapmenu button{border:0;background:transparent;text-align:left;border-radius:6px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:1px}
.snapmenu button:hover{background:var(--bg)}
.snapmenu small{font-weight:400;color:var(--muted);font-size:11.5px}
.snapov{position:absolute;inset:0;z-index:7;cursor:crosshair;touch-action:none}
.snapov .bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;padding:5px 6px 5px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.snapov .bar button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px;cursor:pointer}
.snaprect{position:absolute;border:2px dashed #fff;outline:1px solid rgba(0,0,0,.5);background:rgba(126,160,255,.12);pointer-events:none}
.snaptoast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:8;pointer-events:none}
@media (max-width:820px){
  html,body{height:auto;overflow:visible}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  /* map fills most of the screen; a strip of the panel stays visible below it to swipe on */
  .stage{height:calc(100vh - 150px);height:calc(100svh - 150px);min-height:340px;max-height:900px;order:-1}
  .rail{overflow:visible}
  /* phone order: map, tap mode, then the planning cards, then event dates and goals */
  #cardMode{order:1} #cardPhases{order:2} #claimCard{order:3} #cardKey{order:4} #cardShare{order:5} #cardEvent{order:6} #cardGoals{order:7}
}
@media (max-width:600px){
  .stage{grid-template-columns:22px 1fr;grid-template-rows:18px 1fr}
  .legend{left:6px;bottom:6px;gap:4px 10px;padding:4px 8px;font-size:11.5px;max-width:calc(100% - 54px)}
  .legend input[type=checkbox]{width:15px!important;height:15px!important;margin:0}
  .legend input[type=range]{width:56px;min-height:0!important;height:16px}
  .legend label{gap:5px}
  .phstep{border-left:0;padding-left:0}
  .phstep b{max-width:90px}
  .hud{right:6px;bottom:6px;gap:4px}
  .hud button{width:30px;height:30px;font-size:15px}
  .dtools{top:6px;gap:4px}
  .dgrp{padding:2px}
  .dgrp button{padding:4px 7px;font-size:11.5px}
  .dgrp .sw{width:19px;height:19px;padding:0;margin:2px 1px}
  .dgrp .sep{margin:3px 2px}
  .dhint{transition:opacity .4s}
  .dhint.faded{opacity:0}
  .modebar{top:6px;font-size:11.5px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ARC Tools shared theme (theme.css): always dark, same colours and type as the rest of the site */
:root[data-theme="dark"]{--bg:var(--arc-bg,#0E1116);--panel:var(--arc-panel,#161A21);--line:var(--arc-line,#232934);--line-strong:var(--arc-line-2,#2E3542);--fg:var(--arc-text,#E8EAEE);--muted:var(--arc-mut,#8B93A1);--accent:var(--arc-accent,#7EA0FF);--accent-soft:var(--arc-accent-soft,#1D2640);--map-bg:#12151A;--danger:var(--arc-bad,#FF7A63);--ok:var(--arc-ok,#5FD394);--ok-soft:var(--arc-ok-soft,#173326);--warn:var(--arc-warn,#F0B35A);--warn-soft:var(--arc-warn-soft,#3A2A12);--f-ui:var(--arc-font,"Geist",system-ui,sans-serif);--f-mono:var(--arc-mono,"Geist Mono",ui-monospace,monospace);color-scheme:dark}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased}
:root[data-theme="dark"] :is(.btn.primary,.modebar,.p-live,.dgrp button[aria-pressed="true"]){color:var(--arc-accent-ink,#0B1020)}
:root[data-theme="dark"] :is(h2,.keyh,.khead,.zh){text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--fg)}
:root[data-theme="dark"] .pill{text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600}
@media (pointer:coarse){.dgrp button{min-height:36px;min-width:36px;justify-content:center}.dgrp .sw{width:28px;height:28px;min-width:28px;min-height:28px}.dot{position:relative}.dot::after{content:"";position:absolute;inset:-12px;border-radius:50%}.rx{width:32px;height:32px}}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <section class="card" id="cardMode">
      <h1>Glowworm's Ruse</h1>
      <p class="sub">Land of the Abyss · server vs server. Pick a goal to see every structure that completes it.</p>
      <div class="seg" role="group" aria-label="Map tap action">
        <button id="mPlan" aria-pressed="true">Mark targets</button>
        <button id="mClaim" aria-pressed="false">Claim</button>
        <button id="mDraw" aria-pressed="false">Draw</button>
      </div>
    </section>

    <section class="card" id="cardEvent">
      <div class="head"><h2>Event start</h2><span class="evtag" id="evTag">Estimated</span></div>
      <div class="row">
        <button class="btn" id="evPrev" aria-label="One day earlier">&#9664;</button>
        <input type="date" id="evDate" class="evdate" aria-label="Event start date (UTC)">
        <button class="btn" id="evNext" aria-label="One day later">&#9654;</button>
      </div>
      <div class="evgrid" id="evInfo"></div>
      <div class="row"><span class="sub" id="evNote" style="flex:1"></span><button class="btn ghost" id="evReset" hidden>Use estimate</button></div>
    </section>

    <section class="card" id="cardGoals">
      <div class="tabs" role="group" aria-label="Goal list">
        <button id="tChron" aria-pressed="true">Chronicles</button>
        <button id="tDom" aria-pressed="false">Domination</button>
      </div>
      <div id="goalList" class="goals"></div>
      <div id="goalDetail" class="detail" hidden></div>
    </section>

    <section class="card" id="cardPhases">
      <div class="head"><h2>Plan phases</h2><div class="row"><button class="btn" id="phDup" title="New phase starting from this one">+ Copy</button><button class="btn ghost" id="phNew">+ Blank</button></div></div>
      <div class="goals" id="phList"></div>
      <div class="detail" id="phDetail"></div>
    </section>

    <section class="card" id="claimCard">
      <div class="head"><h2>Alliances</h2><button class="btn" id="addAl">+ Add</button></div>
      <div id="alList" class="alli"></div>
      <div class="row" id="claimTools"></div>
    </section>

    <section class="card" id="cardKey">
      <details>
        <summary><h2>Map key</h2><span class="note">show</span></summary>
        <div class="key" id="key" style="margin-top:10px"></div>
      </details>
    </section>

    <section class="card" id="cardShare">
      <div class="head"><h2>Share &amp; backup</h2></div>
      <div class="row">
        <button class="btn" id="cpPlan">Copy full plan</button>
        <button class="btn ghost" id="showImp">Paste plan…</button>
      </div>
      <div id="impBox" hidden>
        <textarea id="impText" placeholder="Paste a copied plan here"></textarea>
        <div class="row"><button class="btn primary" id="doImp">Load</button><span id="impMsg" class="note"></span></div>
      </div>
      <span id="cpMsg" class="ok" hidden></span>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="corner"></div>
    <canvas class="ruler" id="rx"></canvas>
    <canvas class="ruler" id="ry"></canvas>
    <div class="mapwrap" id="wrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="vp"><image id="bgimg" href="map.jpg" x="-5" y="-5" width="610" height="610" preserveAspectRatio="none"/><g id="tl"></g><g id="ml"></g><g id="gl"></g><g id="rl"></g><g id="gh"></g><g id="dl"></g></g></svg>
      <div class="modebar" id="modebar" hidden></div>
      <div class="dtools" id="dtools" hidden>
        <div class="dgrp" role="group" aria-label="Drawing tool">
          <button data-tool="hold" title="Alliance stronghold"><svg viewBox="0 0 20 20"><path d="M4 17V8l2-1V4h2v2h1V4h2v2h1V4h2v3l2 1v9h-5v-4H9v4z"/></svg><span>Stronghold</span></button>
          <button data-tool="city" title="Move city here"><svg class="ln" viewBox="0 0 24 24"><path d="M5 11.5 12 5.5l7 6M7 10v8.5h10V10M10.5 18.5v-4.5h3v4.5"/></svg><span>City</span></button>
          <button data-tool="reinf" title="Reinforce"><svg class="ln" viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.4c0 4.3-3 7.4-7 8.9-4-1.5-7-4.6-7-8.9V6.1z"/></svg><span>Reinforce</span></button>
          <button data-tool="atk" title="Attack"><svg class="ln" viewBox="0 0 24 24"><path d="M19.5 4.5l-.8 4.2-8.6 8.6-3.4-3.4 8.6-8.6zM5.4 12.4l6.2 6.2M8.4 15.6l-3.8 3.8"/></svg><span>Attack</span></button>
          <button data-tool="arrow" title="Arrow"><svg viewBox="0 0 20 20"><path d="M3 17L15 5M9 5h6v6" fill="none" stroke-width="2"/></svg><span>Arrow</span></button>
          <button data-tool="circle" title="Circle"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke-width="2"/></svg><span>Circle</span></button>
          <button data-tool="rect" title="Rectangle"><svg viewBox="0 0 20 20"><rect x="3.5" y="5" width="13" height="10" fill="none" stroke-width="2"/></svg><span>Box</span></button>
          <button data-tool="tri" title="Triangle"><svg viewBox="0 0 20 20"><path d="M10 3.5L17 16H3z" fill="none" stroke-width="2" stroke-linejoin="round"/></svg><span>Triangle</span></button>
          <button data-tool="erase" title="Erase: tap a drawing to remove it"><svg viewBox="0 0 20 20"><path d="M4 14l7-9 5 4-6 8H6z M8 17h8" fill="none" stroke-width="2" stroke-linejoin="round"/></svg><span>Erase</span></button>
        </div>
        <div class="dgrp" id="dcolors" role="group" aria-label="Drawing colour"></div>
        <div class="dgrp">
          <button id="dUndo" title="Undo last drawing"><span>Undo</span></button>
          <button id="dClear" title="Remove all drawings"><span>Clear</span></button>
        </div>
        <div class="dhint" id="dhint"></div>
      </div>
      <div class="legend" id="legend">
        <label><input type="checkbox" id="bgChk" checked> Map overlay</label>
        <input type="range" id="bgOp" min="15" max="100" value="65" aria-label="Map overlay opacity">
        <label><input type="checkbox" id="mkChk" checked> Markers</label>
        <label id="ghLbl"><input type="checkbox" id="ghChk"> Previous phase</label>
        <span class="phstep" id="phStep"><button id="phPrev" aria-label="Previous phase">&#9664;</button><span>Ph.<span id="phNum">1</span></span><b id="phName"></b><button id="phNext" aria-label="Next phase">&#9654;</button></span>
      </div>
      <div class="hud"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit map" style="font-size:13px">⤢</button><button id="zsnap" class="snapbtn" aria-label="Save image" title="Save image" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 8.5h3.2l1.6-2.5h6.4l1.6 2.5H20v10H4z"/><circle cx="12" cy="13.2" r="3.3"/></svg></button></div>
      <div class="snapmenu" id="snapMenu" hidden>
        <button id="snapView">Current view<small>Exactly what's on screen</small></button>
        <button id="snapArea">Select area<small>Drag a box over the map</small></button>
        <button id="snapAll">Whole map<small>The full Land of the Abyss</small></button>
      </div>
      <div class="snapov" id="snapOv" hidden><div class="bar"><span>Drag over the area to save</span><button id="snapCancel">Cancel</button></div><div class="snaprect" id="snapRect" hidden></div></div>
      <div class="snaptoast" id="snapToast" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script>
(()=>{
const D=window.GW_DATA, NS="http://www.w3.org/2000/svg";
const PALETTE=["#F4BF41","#F08C33","#BB7128","#784633","#EC4441","#7B2E40","#D7538F","#8647BA","#621D6F","#272742","#3950CF","#3E8CD7","#414569","#627FAB","#428A92","#50B080","#5DA52F","#40632D"];
const KEY="arc-glowworm-v3";
const ZN={Z1:"Zone 1",Z2:"Zone 2",Z3:"Zone 3",Z4:"Zone 4",GT:"Passes"};
const TYPES=D.types, TY={}; TYPES.forEach(t=>TY[t.id]=t);
const items={}; D.t.forEach(t=>items[t.id]={...t,kind:"t"}); D.g.forEach(g=>items[g.id]={...g,kind:"g"});
const ANY="*";
const T={post:["Z1:Level_1_Base"],bastion:["Z1:Bastion"],ptree:["Z1:Plagued_Great_Tree"],temple:["Z1:Temple_of_Conquest","Z1:Temple_of_Protection"],
  oracle:["Z2:Orancle_of_Discovery","Z2:Oracle_of_Recovery"],bazaar:["Z2:Grand_Bazaar"],rest:["Z3:Restorative_Site"],ctree:["Z3:Corrupted_Great_Tree"],
  trees:["Z1:Plagued_Great_Tree","Z3:Corrupted_Great_Tree"],pantheon:["Z3:Pantheon_of_Might","Z3:Pantheon_of_Mystery"],zig:["Z4:Ziggurat_of_Corruption"],
  p1:["GT:L1"],p2:["GT:L2"],p3:["GT:L3"],p4:["GT:L4"]};
const U=(m,d)=>Date.UTC(2026,m-1,d,22);
const CH=[
 [1,"Capture 1 Lv.1 Post","A",T.post,U(10,13)],[2,"Capture 1 Bastion","A",T.bastion,U(10,14)],[3,"Capture 1 Plagued Great Tree","A",T.ptree,U(10,15)],
 [4,"Capture 1 Temple","A",T.temple,U(10,16)],[5,"Capture 1 Oracle","A",T.oracle,U(10,17)],[6,"Capture 1 Grand Bazaar","W",T.bazaar,U(10,18)],
 [7,"Capture 1 Lv.2 Pass","A",T.p2,U(10,19)],[8,"Capture 1 Restorative Site","A",T.rest,U(10,20)],[9,"Capture 1 Corrupted Great Tree","A",T.ctree,U(10,21)],
 [10,"Capture 1 Pantheon","A",T.pantheon,U(10,22)],[11,"Capture 1 Lv.3 Pass","A",T.p3,U(10,23)],[12,"Capture 1 Lv.4 Pass","A",T.p4,U(10,24)],
 [13,"Capture the Ziggurat of Corruption","W",T.zig,U(10,25)]
].map(([n,t,m,ty,st])=>({id:"c"+n,n,title:t,m,ty,start:st,end:st+864e5}));
/* Event schedule: rounds every 56 days from Oct 3, 2026 (00:00 UTC), same as the Era Grouping calculator.
   Announcement 5d, Matching 1d, Reveal & Prelude 5d, Land of the Abyss 14d, Closing 3d.
   Chapter 1 opens 10d 22h after the round starts, then one chapter per day. */
const DAYMS=864e5, EV_ANCHOR=Date.UTC(2026,9,3), EV_CYCLE=56*DAYMS, EV_LEN=28*DAYMS, CH_OFF=CH[0].start-EV_ANCHOR;
const estStart=(now=Date.now())=>{let k=Math.floor((now-EV_ANCHOR)/EV_CYCLE); let st=EV_ANCHOR+k*EV_CYCLE; if(now>=st+EV_LEN) st+=EV_CYCLE; return st;};
const PHASES=[["Announcement",5],["Matching",1],["Reveal & Prelude",5],["Land of the Abyss",14],["Closing",3]];
const toYMD=t=>new Date(t).toISOString().slice(0,10);
const fromYMD=v=>{const [y,m,d]=v.split("-").map(Number); return Date.UTC(y,m-1,d);};
const DOM=[
 ["d1","Capture 10 Territories","A",ANY,10,33],["d2","Capture 30 Territories","A",ANY,30,33],["d3","Capture 50 Territories","A",ANY,50,33],
 ["d4","Capture 1 Bastion","A",T.bastion,1,2],["d5","Capture 2 Great Trees","A",T.trees,2,1],["d6","Capture 2 Temples","A",T.temple,2,2],
 ["d7","Capture 4 Lv.1 Passes","W",T.p1,4,4,"Lv.14 Valor"],["d8","Capture 2 Oracles","A",T.oracle,2,2],["d9","Capture 1 Grand Bazaar","A",T.bazaar,1,1],
 ["d10","Capture 2 Grand Bazaars","W",T.bazaar,2,1],["d11","Capture 4 Lv.2 Passes","W",T.p2,4,0,"Lv.16 Valor"],["d12","Capture 4 Lv.3 Passes","W",T.p3,4,0],
 ["d13","Capture 3 Pantheons","A",T.pantheon,3,0,"Lv.14 Valor"],["d14","Capture 6 Lv.4 Passes","W",T.p4,6,0,"Lv.16 Valor"],["d15","Capture the Ziggurat of Corruption","W",T.zig,1,0]
].map(([id,title,m,ty,need,have,req])=>({id,title,m,ty,need,have,req}));
const GOALS={}; CH.forEach(g=>GOALS[g.id]=g); DOM.forEach(g=>GOALS[g.id]=g);
const seed=()=>{const p={}; DOM.forEach(d=>p[d.id]=0); return {prog:p,chDone:{}};};
let S={alliances:[],active:null,owner:{},tgt:{},shapes:[],tool:"hold",dcol:null,mode:"plan",tab:"chron",goal:null,bg:true,bgOp:65,mk:true,...seed()};
try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r);
  // Older versions pre-filled progress; drop it if the saved values were never changed.
  if(!o.seedV){const oldP=o.prog||{}, oldC=o.chDone||{};
    const untouchedP=DOM.every(d=>(oldP[d.id]||0)===d.have);
    const untouchedC=Object.keys(oldC).sort().join()===["c1","c2","c3","c4","c5","c6"].join();
    if(untouchedP) delete o.prog; if(untouchedC) delete o.chDone;}
  S={...S,...o};}}catch(e){}
S.seedV=2;
/* Plan phases: each phase keeps its own claims (owner) and map drawings (shapes). Goal tracking is shared. */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const normPh=p=>({id:p.id||uid(),name:p.name||"Phase",notes:p.notes||"",owner:p.owner&&typeof p.owner==="object"?p.owner:{},shapes:Array.isArray(p.shapes)?p.shapes:[]});
if(!Array.isArray(S.phases)||!S.phases.length) S.phases=[{id:uid(),name:"Phase 1",notes:"",owner:S.owner||{},shapes:S.shapes||[]}];
S.phases=S.phases.map(normPh); S.ph=Math.min(Math.max(0,S.ph|0),S.phases.length-1);
S.owner=S.phases[S.ph].owner; S.shapes=S.phases[S.ph].shapes;
const syncPh=()=>{const p=S.phases[S.ph]; if(p){p.owner=S.owner; p.shapes=S.shapes;}};
const save=()=>{syncPh(); try{const {owner,shapes,...rest}=S; localStorage.setItem(KEY,JSON.stringify(rest))}catch(e){} phMetaLive();};
function phMetaLive(){const p=S.phases[S.ph], el=document.querySelector(`#phList [data-ph="${S.ph}"] .meta`); if(p&&el) el.textContent=phMeta(p);}
const typeOf=id=>items[id].ty;
const alById=id=>S.alliances.find(a=>a.id===id);
const $=s=>document.getElementById(s);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const elig=(g,id)=>g.ty===ANY?items[id].kind==="t":g.ty.includes(typeOf(id));
const ST=["target","captured","restored"], STN={target:"Target",captured:"Captured",restored:"Restored"};
const STC={target:"#ffffff",captured:"#f5a524",restored:"#22c55e"};
const evStart=()=>{const v=S.evStart; return (typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v))?fromYMD(v):estStart();};
function applySchedule(){const st=evStart(); CH.forEach((c,i)=>{c.start=st+CH_OFF+i*DAYMS; c.end=c.start+DAYMS;});}
applySchedule();
if(!S.goal){const nx=CH.find(c=>!S.chDone[c.id]&&c.end>Date.now()); S.goal=nx?nx.id:"c13";}

/* ---------- map build ---------- */
const tl=$("tl"),ml=$("ml"),gl=$("gl"),rl=$("rl"),els={};
const fy=y=>600-y;
D.t.forEach(t=>{
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d","M"+t.p.map(([x,y])=>x+" "+fy(y)).join("L")+"Z");
  p.setAttribute("class","terr"); p.dataset.id=t.id; tl.appendChild(p); els[t.id]=p;
  const m=document.createElementNS(NS,"circle"); m.setAttribute("cx",t.s[0]); m.setAttribute("cy",fy(t.s[1]));
  m.dataset.id=t.id; m.style.cursor="pointer"; ml.appendChild(m); els[t.id+"_m"]=m;
});
D.g.forEach(g=>{
  const r=document.createElementNS(NS,"rect"),gg=document.createElementNS(NS,"g");
  gg.setAttribute("class","gate"); gg.setAttribute("transform",`translate(${g.s[0]} ${fy(g.s[1])}) rotate(45)`);
  r.setAttribute("x",-3.6);r.setAttribute("y",-3.6);r.setAttribute("width",7.2);r.setAttribute("height",7.2);r.setAttribute("rx",1.2);
  r.setAttribute("vector-effect","non-scaling-stroke"); r.dataset.id=g.id; gg.appendChild(r); gl.appendChild(gg); els[g.id]=r;
});
const mr=t=>{const r=TY[t].r; return r>20?4.4:r>12?2.8:1.8;};

function paint(){
  const svg=$("map"), g=GOALS[S.goal];
  svg.classList.toggle("bgon",S.bg); svg.classList.toggle("dim",!!g&&g.ty!==ANY);
  $("bgimg").style.display=S.bg?"":"none"; $("bgimg").setAttribute("opacity",S.bgOp/100);
  ml.style.display=S.mk?"":"none";
  D.t.forEach(t=>{
    const a=alById(S.owner[t.id]),p=els[t.id],e=g&&elig(g,t.id);
    p.classList.toggle("own",!!a); p.classList.toggle("elig",!!e); p.style.fill=a?a.color:"";
    const m=els[t.id+"_m"], ty=TY[t.ty], focus=g&&g.ty!==ANY;
    m.setAttribute("r",mr(t.ty)*(focus&&e?1.5:1)); m.setAttribute("fill",ty.color);
    m.setAttribute("stroke","rgba(0,0,0,.65)"); m.setAttribute("stroke-width",.5);
    m.classList.toggle("mk-dim",!!focus&&!e);
  });
  D.g.forEach(gt=>{
    const a=alById(S.owner[gt.id]),r=els[gt.id],e=g&&elig(g,gt.id);
    r.setAttribute("fill",a?a.color:TY[gt.ty].color); r.setAttribute("stroke",a?"#fff":"rgba(0,0,0,.7)"); r.setAttribute("stroke-width",a?1.6:1);
    r.parentNode.classList.toggle("mk-dim",!!g&&g.ty!==ANY&&!e);
    r.parentNode.setAttribute("transform",`translate(${gt.s[0]} ${fy(gt.s[1])}) rotate(45) scale(${g&&e&&g.ty!==ANY?1.35:1})`);
  });
  rl.innerHTML="";
  for(const id in S.tgt){const it=items[id]; if(!it) continue; const st=S.tgt[id];
    const c=document.createElementNS(NS,"circle"); c.setAttribute("cx",it.s[0]); c.setAttribute("cy",fy(it.s[1]));
    c.setAttribute("r",it.kind==="g"?7.5:Math.max(6,mr(it.ty)*1.5+3.5)); c.setAttribute("fill","none"); c.setAttribute("stroke",STC[st]);
    c.setAttribute("stroke-width",st==="target"?1.4:2); c.setAttribute("vector-effect","non-scaling-stroke");
    if(st==="target") c.setAttribute("stroke-dasharray","3 2"); c.style.pointerEvents="none";
    const c2=c.cloneNode(); c2.setAttribute("stroke","rgba(0,0,0,.55)"); c2.setAttribute("stroke-width",st==="target"?3:4); c2.removeAttribute("stroke-dasharray");
    rl.append(c2,c);}
}

/* ---------- goals ---------- */
const fmtDur=ms=>{const m=Math.round(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60; return d?`${d}d ${h}h`:h?`${h}h ${mm}m`:`${mm}m`;};
const fmtWhen=t=>new Date(t).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"});
function goalCounts(g){const c={eligible:0,target:0,captured:0,restored:0};
  Object.keys(items).forEach(id=>{if(!elig(g,id))return; c.eligible++; const s=S.tgt[id]; if(s) c[s]++;}); return c;}
function chState(c){const now=Date.now(),cnt=goalCounts(c);
  if(S.chDone[c.id]||cnt.restored>0) return {k:"done",pill:"Done",cls:"p-done",meta:c.end<now?"Completed":"Completed · ends "+fmtWhen(c.end)};
  if(now>=c.end) return {k:"miss",pill:"Ended",cls:"p-up",meta:"Ended "+fmtWhen(c.end)};
  if(now>=c.start) return {k:"live",pill:"Live",cls:"p-live",meta:"Ends in "+fmtDur(c.end-now)+" · "+fmtWhen(c.end)};
  const nx=CH.find(x=>x.start>now); return {k:"up",pill:nx&&nx.id===c.id?"Next":"Upcoming",cls:nx&&nx.id===c.id?"p-next":"p-up",meta:"Opens "+fmtWhen(c.start)+" · in "+fmtDur(c.start-now)};
}
function renderGoals(){
  const box=$("goalList"); box.innerHTML="";
  $("tChron").setAttribute("aria-pressed",String(S.tab==="chron")); $("tDom").setAttribute("aria-pressed",String(S.tab==="dom"));
  if(S.tab==="chron") CH.forEach(c=>{const st=chState(c);
    const b=document.createElement("button"); b.className="goal"+(S.goal===c.id?" sel":"")+(st.k==="done"?" done":"");
    b.innerHTML=`<span class="ch">Ch.${c.n}</span><span><div class="tt">${c.title}</div><div class="meta">${c.m==="W"?"World":"Alliance"} · ${st.meta}</div></span><span class="pill ${st.cls}">${st.pill}</span>`;
    b.onclick=()=>{S.goal=S.goal===c.id?null:c.id; save(); renderAll();}; box.appendChild(b);});
  else DOM.forEach(d=>{const have=S.prog[d.id]||0, done=have>=d.need;
    const b=document.createElement("div"); b.className="goal"+(S.goal===d.id?" sel":"")+(done?" done":""); b.tabIndex=0;
    b.innerHTML=`<span class="pill ${done?"p-done":"p-open"}" style="justify-self:center">${done?"✓":d.need-have}</span><span><div class="tt">${d.title}</div><div class="meta">${d.m==="W"?"World":"Alliance"}${d.req?" · needs "+d.req:""}</div></span>
      <span class="step"><button aria-label="Less">−</button><span>${have}/${d.need}</span><button aria-label="More">+</button></span>`;
    const [mi,pl]=b.querySelectorAll(".step button");
    mi.onclick=e=>{e.stopPropagation(); S.prog[d.id]=Math.max(0,have-1); save(); renderGoals();};
    pl.onclick=e=>{e.stopPropagation(); S.prog[d.id]=have+1; save(); renderGoals();};
    b.onclick=()=>{S.goal=S.goal===d.id?null:d.id; save(); renderAll();};
    b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault(); b.onclick();}};
    box.appendChild(b);});
  renderDetail();
}
function renderDetail(){
  const box=$("goalDetail"), g=GOALS[S.goal]; if(!g){box.hidden=true; return;} box.hidden=false;
  const c=goalCounts(g);
  const isCh=!!g.n;
  box.innerHTML=`<div class="row"><b style="font-size:13px">${isCh?"Ch."+g.n+" · ":""}${g.title}</b></div>
    <div class="tg"><span><b>${c.eligible}</b> on map</span><span><b>${c.target}</b> targeted</span><span><b>${c.captured}</b> captured</span><span><b>${c.restored}</b> restored</span></div>
    <p class="sub" style="margin:0">${S.mode==="plan"?"Tap a highlighted structure to mark it: target, then captured, then restored. Tap again to clear.":"Switch to Mark targets to plan this goal on the map."} Chronicle missions only count once the structure is captured and restored.</p>
    ${isCh?`<div class="row"><label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="chDoneChk" ${S.chDone[g.id]?"checked":""}> Completed in game</label></div>`:""}`;
  const ck=$("chDoneChk"); if(ck) ck.onchange=e=>{if(e.target.checked) S.chDone[g.id]=1; else delete S.chDone[g.id]; save(); renderGoals(); };
}
$("tChron").onclick=()=>{S.tab="chron"; save(); renderGoals();};

function arrowPath(x0,y0,x1,y1){const L=Math.hypot(x1-x0,y1-y0)||1, h=Math.min(L*.35,9), ux=(x1-x0)/L, uy=(y1-y0)/L;
  const bx=x1-ux*h, by=y1-uy*h, w=h*.55; return `M${x0} ${y0}L${bx} ${by}M${x1} ${y1}L${bx-uy*w} ${by+ux*w}L${bx+uy*w} ${by-ux*w}Z`;}

  const st={fill:"none",stroke:col,"stroke-width":2.5,"vector-effect":"non-scaling-stroke","stroke-linejoin":"round","stroke-linecap":"round"};

  if(isPin(sh.t)){

/* ---------- view: pan / zoom ---------- */
const wrap=$("wrap"),vp=$("vp");
let V={s:1,x:0,y:0};
let fitMode="fill";
function fit(mode){const r=wrap.getBoundingClientRect(), whole=Math.min(r.width,r.height)/620;
  let s=whole; if(mode!=="whole"&&r.height>r.width*1.15) s=Math.min(r.height/612, r.width*1.7/600);   // tall phone screens: fill the height
  fitMode=s>whole*1.01?"fill":"whole"; V={s,x:(r.width-600*s)/2,y:(r.height-600*s)/2}; apply();}
function apply(){vp.setAttribute("transform",`translate(${V.x} ${V.y}) scale(${V.s})`); rulers();}
function zoomAt(f,cx,cy){const ns=Math.min(40,Math.max(.4,V.s*f)); f=ns/V.s; V.x=cx-(cx-V.x)*f; V.y=cy-(cy-V.y)*f; V.s=ns; apply();}
wrap.addEventListener("wheel",e=>{e.preventDefault(); const r=wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
const ptrs=new Map(); let moved=0,last=null,pinch=null;
const toMap=e=>{const r=wrap.getBoundingClientRect(); return {x:(e.clientX-r.left-V.x)/V.s, y:(e.clientY-r.top-V.y)/V.s};};
const SHAPES=["arrow","circle","rect","tri"];
wrap.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; last={x:e.clientX,y:e.clientY};

  if(S.mode==="draw"&&ptrs.size===1&&S.tool!=="erase"){const m=toMap(e), hit=pointAt(m);
    if(hit>=0){const sh=S.shapes[hit]; drag={i:hit,dx:sh.x-m.x,dy:sh.y-m.y,moved:false}; try{wrap.setPointerCapture(e.pointerId);}catch(_){} return;}}
  if(S.mode==="draw"&&SHAPES.includes(S.tool)&&ptrs.size===1){const m=toMap(e); draft={t:S.tool,...curPaint(),x0:m.x,y0:m.y,x1:m.x,y1:m.y}; try{wrap.setPointerCapture(e.pointerId);}catch(_){}}
});
wrap.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){hover(e);return;}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2, r=wrap.getBoundingClientRect();
    V.x+=mx-pinch.mx; V.y+=my-pinch.my; zoomAt(d/pinch.d,mx-r.left,my-r.top); pinch.d=d; pinch.mx=mx; pinch.my=my; moved=99; return;}
  const dx=e.clientX-last.x,dy=e.clientY-last.y; moved+=Math.abs(dx)+Math.abs(dy); last={x:e.clientX,y:e.clientY};
  if(drag){if(moved>4){const m=toMap(e), sh=S.shapes[drag.i]; sh.x=m.x+drag.dx; sh.y=m.y+drag.dy; drag.moved=true; paintShapes();} $("tip").hidden=true; return;}
  if(draft){const m=toMap(e); draft.x1=m.x; draft.y1=m.y; paintShapes(); $("tip").hidden=true; return;}
  if(S.mode==="draw") return;
  if(moved>5){wrap.classList.add("drag"); V.x+=dx; V.y+=dy; apply(); $("tip").hidden=true;}
});
const up=e=>{
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; wrap.classList.remove("drag");
  if(ptrs.size===1){const q=[...ptrs.values()][0]; last={x:q.x,y:q.y}; moved=99; return;}   // one finger still down after a pinch
  if(drag){const d=drag; drag=null; if(d.moved) save(); return;}
  if(draft){const d=draft; draft=null; if(e.type==="pointerup"&&Math.hypot(d.x1-d.x0,d.y1-d.y0)*V.s>8){S.shapes.push(d); save();} paintShapes(); return;}
  if(!(had&&moved<=5&&e.type==="pointerup")) return;
  if(S.mode==="draw"){
    if(S.tool==="hold"){const a=alById(S.active); if(!a) return; const m=toMap(e); S.shapes.push({t:"hold",al:a.id,x:m.x,y:m.y}); save(); paintShapes(); renderAlliances();}
    else if(isPin(S.tool)){const m=toMap(e); S.shapes.push({t:S.tool,...curPaint(),x:m.x,y:m.y}); save(); paintShapes();}
    else if(S.tool==="erase"){const el=document.elementFromPoint(e.clientX,e.clientY); const i=el&&el.dataset&&el.dataset.sh; if(i!=null&&i!==""&&+i>=0){S.shapes.splice(+i,1); save(); paintShapes();}}
    return;}
  const el=document.elementFromPoint(e.clientX,e.clientY); const id=el&&el.dataset&&el.dataset.id; if(id) act(id,e);
};

function act(id,e){
  if(S.mode==="plan"){const g=GOALS[S.goal]; if(!g||!elig(g,id)) return;
    const cur=S.tgt[id], i=cur?ST.indexOf(cur)+1:0; if(i>=ST.length) delete S.tgt[id]; else S.tgt[id]=ST[i];
    save(); paint(); renderGoals(); hover(e); return;}
  if(!S.active){updateModebar(); return;}
  if(S.owner[id]===S.active) delete S.owner[id]; else S.owner[id]=S.active;
  save(); paint(); renderAlliances(); hover(e);
}
function hover(e){
  const el=document.elementFromPoint(e.clientX,e.clientY), id=el&&el.dataset&&el.dataset.id, tip=$("tip");
  if(!id||!items[id]){tip.hidden=true;return;}

  const xy=it.s.map(v=>Math.round(v));
  tip.innerHTML=`<b>${ty.name}</b><br>
    <span class="mono">X:${xy[0]} Y:${xy[1]}</span><br>
    <span class="k">${it.kind==="g"?it.g:ZN[it.z]}</span><br>
    ${a?`<span style="color:${a.color}">●</span> ${esc(a.name)}`:'<span class="k">Unclaimed</span>'}${st?`<br><span style="color:${st==="target"?"inherit":STC[st]}">◎ ${STN[st]}</span>`:""}`;
  const r=wrap.getBoundingClientRect(); tip.hidden=false;
  let x=e.clientX-r.left+14,y=e.clientY-r.top+14; const w=tip.offsetWidth,h=tip.offsetHeight;
  if(x+w>r.width-6) x=e.clientX-r.left-w-14; if(y+h>r.height-6) y=e.clientY-r.top-h-14;

}

/* ---------- rulers (game coordinates) ---------- */
function rulers(){
  const cs=getComputedStyle(document.documentElement), fg=cs.getPropertyValue("--muted").trim(), ln=cs.getPropertyValue("--line-strong").trim();
  const steps=[5,10,25,50,100,200]; const step=steps.find(s=>s*V.s>=46)||200;
  const dr=(cv,horiz)=>{
    const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect(); cv.width=r.width*dpr; cv.height=r.height*dpr;
    const c=cv.getContext("2d"); c.scale(dpr,dpr); c.clearRect(0,0,r.width,r.height);
    c.fillStyle=fg; c.strokeStyle=ln; c.font="10px "+cs.getPropertyValue("--f-mono");
    const len=horiz?r.width:r.height;
    const g0=horiz?(-V.x)/V.s:600-(len-V.y)/V.s, g1=horiz?(len-V.x)/V.s:600+V.y/V.s;
    for(let g=Math.ceil(g0/(step/5))*(step/5); g<=g1; g+=step/5){
      const major=Math.abs(g/step-Math.round(g/step))<1e-6;
      const p=horiz?g*V.s+V.x:(600-g)*V.s+V.y;
      c.beginPath();
      if(horiz){c.moveTo(p+.5,r.height); c.lineTo(p+.5,r.height-(major?9:4));}
      else{c.moveTo(r.width,p+.5); c.lineTo(r.width-(major?9:4),p+.5);}
      c.stroke();
      if(major&&g>=0&&g<=600){
        if(horiz){c.textAlign="center"; c.fillText(Math.round(g),p,11);}
        else{c.save(); c.translate(12,p); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(Math.round(g),0,0); c.restore();}
      }
    }
  };
  dr($("rx"),true); dr($("ry"),false);
}
let touched=false; wrap.addEventListener("pointerdown",()=>touched=true); wrap.addEventListener("wheel",()=>touched=true);
let lastSz=null;
new ResizeObserver(()=>{const r=wrap.getBoundingClientRect();
  if(!touched){lastSz={w:r.width,h:r.height}; fit(); return;}
  if(lastSz){V.x+=(r.width-lastSz.w)/2; V.y+=(r.height-lastSz.h)/2; apply();} else rulers();
  lastSz={w:r.width,h:r.height};}).observe(wrap);
["zin","zout","zfit","zsnap"].forEach(i=>$(i).addEventListener("click",()=>touched=true));
if(!S.active&&S.alliances[0]) S.active=S.alliances[0].id;
/* ---------- plan phases ---------- */
let phConfirm=null;
function phMeta(p){const m=p.shapes.length, n=Object.keys(p.owner).length; return `${m} marking${m===1?"":"s"} · ${n} claimed`;}
function goPhase(i){if(i<0||i>=S.phases.length) return; syncPh(); S.ph=i; S.owner=S.phases[i].owner; S.shapes=S.phases[i].shapes; phConfirm=null; draft=null; drag=null; save(); renderAll(); renderPhases();}
function renderPhases(){syncPh();
  $("phList").innerHTML=S.phases.map((p,i)=>`<button class="goal${i===S.ph?" sel":""}" data-ph="${i}"><span class="ch">Ph.${i+1}</span><span><div class="tt">${esc(p.name)}</div><div class="meta">${phMeta(p)}</div></span>${i===S.ph?'<span class="pill p-live">On map</span>':"<span></span>"}</button>`).join("");
  const p=S.phases[S.ph]; let h=`<div class="field"><label for="phNameIn">Phase name</label><input class="input" id="phNameIn" maxlength="40" value="${esc(p.name)}"></div>
    <div class="field"><label for="phNotes">Orders</label><textarea id="phNotes" placeholder="Timing, who goes where, rally leaders…">${esc(p.notes)}</textarea></div>`;
  if(phConfirm==="del") h+=`<div class="confirm">Delete “${esc(p.name)}”? <button class="btn danger" id="phDelYes">Delete</button><button class="btn ghost" id="phNo">Cancel</button></div>`;
  else if(phConfirm==="clear") h+=`<div class="confirm">Remove every marking and claim in this phase? <button class="btn danger" id="phClearYes">Clear</button><button class="btn ghost" id="phNo">Cancel</button></div>`;
  else h+=`<div class="row"><span class="row"><button class="btn" id="phUp" ${S.ph===0?"disabled":""} aria-label="Move earlier">↑</button><button class="btn" id="phDown" ${S.ph===S.phases.length-1?"disabled":""} aria-label="Move later">↓</button></span><span class="row"><button class="btn ghost" id="phClear">Clear phase</button><button class="btn ghost danger" id="phDel" ${S.phases.length<2?"disabled":""}>Delete</button></span></div>`;
  $("phDetail").innerHTML=h;
  $("phNum").textContent=S.ph+1; $("phName").textContent=p.name; $("phPrev").disabled=S.ph===0; $("phNext").disabled=S.ph===S.phases.length-1;
  $("ghLbl").hidden=S.phases.length<2; $("ghChk").checked=!!S.ghost; $("ghChk").disabled=S.ph===0;
  document.querySelectorAll("#phList [data-ph]").forEach(b=>b.onclick=()=>goPhase(+b.dataset.ph));
  const ni=$("phNameIn"); ni.oninput=()=>{p.name=ni.value.trim()||"Phase"; $("phName").textContent=p.name; const t=document.querySelector(`#phList [data-ph="${S.ph}"] .tt`); if(t) t.textContent=p.name; save();};
  $("phNotes").oninput=e=>{p.notes=e.target.value; save();};
  const on=(id,f)=>{const el=$(id); if(el) el.onclick=f;};
  on("phUp",()=>movePh(-1)); on("phDown",()=>movePh(1));
  on("phDel",()=>{phConfirm="del"; renderPhases();}); on("phClear",()=>{phConfirm="clear"; renderPhases();}); on("phNo",()=>{phConfirm=null; renderPhases();});
  on("phDelYes",()=>{S.phases.splice(S.ph,1); const i=Math.max(0,S.ph-1); S.ph=-1; S.owner=S.phases[i].owner; S.shapes=S.phases[i].shapes; S.ph=i; phConfirm=null; save(); renderAll(); renderPhases();});
  on("phClearYes",()=>{S.owner={}; S.shapes=[]; phConfirm=null; save(); renderAll(); renderPhases();});
}
function movePh(d){const i=S.ph,j=i+d; if(j<0||j>=S.phases.length) return; syncPh(); [S.phases[i],S.phases[j]]=[S.phases[j],S.phases[i]]; S.ph=j; save(); renderAll(); renderPhases();}
function addPh(copy){syncPh(); const src=S.phases[S.ph];
  const n=copy?{id:uid(),name:"Phase "+(S.phases.length+1),notes:"",owner:JSON.parse(JSON.stringify(src.owner)),shapes:JSON.parse(JSON.stringify(src.shapes))}
              :{id:uid(),name:"Phase "+(S.phases.length+1),notes:"",owner:{},shapes:[]};
  S.phases.splice(S.ph+1,0,n); goPhase(S.ph+1);}

["phPrev","phNext"].forEach(i=>$(i).addEventListener("pointerdown",e=>e.stopPropagation()));

/* ---------- save image ---------- */
const SNAP_PROPS=["fill","fill-opacity","stroke","stroke-width","stroke-opacity","stroke-dasharray","stroke-linejoin","stroke-linecap","opacity","display","visibility","font-family","font-size","font-weight","paint-order","text-anchor","dominant-baseline"];
let mapData=null;
function mapDataURL(){if(mapData) return Promise.resolve(mapData);
  return fetch($("bgimg").getAttribute("href")).then(r=>r.blob()).then(b=>new Promise((ok,no)=>{const fr=new FileReader(); fr.onload=()=>ok(mapData=fr.result); fr.onerror=no; fr.readAsDataURL(b);}));}
function snapToast(msg){const t=$("snapToast"); t.textContent=msg; t.hidden=false; clearTimeout(snapToast.t); snapToast.t=setTimeout(()=>t.hidden=true,2600);}
/* r = area in map units; k = output pixels per map unit */
async function saveImage(r,label){
  $("snapMenu").hidden=true; $("zsnap").setAttribute("aria-expanded","false");
  if(r.w<4||r.h<4){snapToast("That area is too small."); return;}
  const MAXPX=4096; let k=Math.max(V.s*2,2400/Math.max(r.w,r.h)); k=Math.min(k,MAXPX/Math.max(r.w,r.h));
  const W=Math.round(r.w*k), H=Math.round(r.h*k), lw=Math.max(1,k/V.s);   // lw: keep on-screen line weights at the new scale
  const src=$("map"), clone=src.cloneNode(true);
  const a=src.querySelectorAll("*"), b=clone.querySelectorAll("*");
  for(let i=0;i<a.length;i++){const cs=getComputedStyle(a[i]); if(cs.display==="none"){b[i].setAttribute("display","none"); continue;}
    let st=""; SNAP_PROPS.forEach(pr=>{let v=cs.getPropertyValue(pr); if(!v) return;
      if(pr==="stroke-width"&&cs.getPropertyValue("vector-effect")==="non-scaling-stroke") v=(parseFloat(v)*lw/k)+"px";
      st+=pr+":"+v+";";});
    if(cs.getPropertyValue("vector-effect")==="non-scaling-stroke"){b[i].removeAttribute("vector-effect");
      const dash=cs.getPropertyValue("stroke-dasharray"); if(dash&&dash!=="none") st+="stroke-dasharray:"+dash.split(/[ ,]+/).map(x=>parseFloat(x)*lw/k).join(" ")+";";}
    b[i].setAttribute("style",st); b[i].removeAttribute("class");}
  clone.querySelector("#vp").setAttribute("transform","");
  const img=clone.querySelector("#bgimg");
  if(img&&S.bg){try{img.setAttribute("href",await mapDataURL());}catch(e){img.remove();}} else if(img) img.remove();
  clone.setAttribute("viewBox",`${r.x} ${r.y} ${r.w} ${r.h}`); clone.setAttribute("width",W); clone.setAttribute("height",H);
  clone.removeAttribute("style"); clone.removeAttribute("class");
  const css=getComputedStyle(document.documentElement), bg=css.getPropertyValue("--bg").trim()||"#0f1115", fg=css.getPropertyValue("--fg").trim()||"#e8eaef", mu=css.getPropertyValue("--muted").trim()||"#8d95a5";
  const xml=new XMLSerializer().serializeToString(clone);
  const pic=new Image();
  pic.onerror=()=>snapToast("Couldn't draw the image.");
  pic.onload=()=>{
    const font=css.getPropertyValue("--f-ui").trim()||"system-ui, sans-serif", sc=Math.max(1,Math.min(2,W/900));
    const used=S.alliances.filter(al=>Object.values(S.owner).includes(al.id)||S.shapes.some(x=>x.al===al.id));
    const footH=Math.round(44*sc), cv=document.createElement("canvas"); cv.width=W; cv.height=H+footH;
    const c=cv.getContext("2d"); c.fillStyle=bg; c.fillRect(0,0,cv.width,cv.height); c.drawImage(pic,0,0,W,H);
    c.textBaseline="middle"; const y=H+footH/2; let x=Math.round(16*sc);
    c.font=`600 ${13*sc}px ${font}`; c.fillStyle=fg; c.fillText("Glowworm's Ruse",x,y); x+=c.measureText("Glowworm's Ruse").width+18*sc;
    c.font=`400 ${12.5*sc}px ${font}`; c.fillStyle=mu; const ev=toYMD(evStart()), phl=`Phase ${S.ph+1} · ${S.phases[S.ph].name} · ${fmtDay(evStart())} round`; c.fillText(phl,x,y); x+=c.measureText(phl).width+22*sc;
    used.forEach(al=>{c.fillStyle=al.color; c.beginPath(); c.arc(x+6*sc,y,6*sc,0,7); c.fill(); x+=17*sc; c.fillStyle=fg; c.font=`600 ${12.5*sc}px ${font}`; c.fillText(al.name,x,y); x+=c.measureText(al.name).width+16*sc;});
    cv.toBlob(blob=>{if(!blob){snapToast("Couldn't save the image."); return;}
      const name=`glowworms-ruse-${ev}-phase-${S.ph+1}-${label}.png`, url=URL.createObjectURL(blob), l=document.createElement("a");
      l.href=url; l.download=name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); snapToast("Image saved");},"image/png");
  };
  pic.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);
}
const viewRect=()=>{const r=wrap.getBoundingClientRect(); return {x:-V.x/V.s,y:-V.y/V.s,w:r.width/V.s,h:r.height/V.s};};

$("snapCancel").onclick=e=>{e.stopPropagation(); $("snapOv").hidden=true;};
(()=>{const ov=$("snapOv"), box=$("snapRect"); let p0=null;
  ov.addEventListener("pointerdown",e=>{if(e.target.closest(".bar")) return; e.stopPropagation(); const r=wrap.getBoundingClientRect(); p0={x:e.clientX-r.left,y:e.clientY-r.top}; try{ov.setPointerCapture(e.pointerId);}catch(_){}
    Object.assign(box.style,{left:p0.x+"px",top:p0.y+"px",width:"0px",height:"0px"}); box.hidden=false;});
  ov.addEventListener("pointermove",e=>{if(!p0) return; const r=wrap.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    Object.assign(box.style,{left:Math.min(x,p0.x)+"px",top:Math.min(y,p0.y)+"px",width:Math.abs(x-p0.x)+"px",height:Math.abs(y-p0.y)+"px"});});
  const end=e=>{if(!p0) return; const r=wrap.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, a=p0; p0=null; box.hidden=true;
    if(e.type!=="pointerup") return; if(Math.abs(x-a.x)<12||Math.abs(y-a.y)<12){snapToast("Drag a bigger box."); return;}
    ov.hidden=true; saveImage({x:(Math.min(x,a.x)-V.x)/V.s,y:(Math.min(y,a.y)-V.y)/V.s,w:Math.abs(x-a.x)/V.s,h:Math.abs(y-a.y)/V.s},"area");};
  ov.addEventListener("pointerup",end); ov.addEventListener("pointercancel",end);
  ov.addEventListener("wheel",e=>{e.preventDefault(); const r=wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
})();

renderKey(); setMode(S.mode); renderAll(); renderTools(); renderPhases(); fit();
})();
