<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Murong's Grand Melee (preview)</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/theme.css">
<script src="/nav.js" data-title="Grand Melee preview" data-accent="#F08C33" defer></script>
<style id="gm-css">
/* Layout: control rail on the left, full-bleed pannable map on the right; stacks on phones (same system as the Glowworm's Ruse planner) */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#dfe2e8; --line-strong:#c5cad4;
  --fg:#161a22; --muted:#626a7a; --accent:#2f5fd0; --accent-soft:#e7edfb;
  --map-bg:#e9e6df; --tile:#f6f3ec; --tile-line:#8f8676; --tile-key:#ebe4d4; --gold:#b98512; --amber:#c9731f; --label:#4a443a;
  --danger:#c2412d; --ok:#1d8a50; --ok-soft:#dcf3e6;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#171a20; --line:#262a33; --line-strong:#353b47;
  --fg:#e8eaef; --muted:#8d95a5; --accent:#7ea0ff; --accent-soft:#1d2640;
  --map-bg:#14161a; --tile:#2a2823; --tile-line:#6d6658; --tile-key:#363024; --gold:#f0b23a; --amber:#e08a3c; --label:#cfc7b6;
  --danger:#ff7a63; --ok:#5fd394; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --line:#262a33; --line-strong:#353b47;
  --fg:#e8eaef; --muted:#8d95a5; --accent:#7ea0ff; --accent-soft:#1d2640;
  --map-bg:#14161a; --tile:#2a2823; --tile-line:#6d6658; --tile-key:#363024; --gold:#f0b23a; --amber:#e08a3c; --label:#cfc7b6;
  --danger:#ff7a63; --ok:#5fd394; --ok-soft:#173326; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:350px minmax(0,1fr);gap:12px;height:100%}
.rail{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:11px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn svg{width:15px;height:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan-name{border:0;background:transparent;font-weight:700;font-size:17px;letter-spacing:-.01em;padding:0;min-width:0;width:100%}
.plan-name:focus{outline:none;border-bottom:1px solid var(--accent)}
.status{font-size:12px;color:var(--muted)}
.status.dirty{color:var(--accent);font-weight:600}
.iconbtns{display:flex;gap:2px}
.iconbtns button{width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.iconbtns button:hover:not([disabled]){border-color:var(--line-strong);color:var(--fg)}
.iconbtns button[disabled]{opacity:.35;cursor:default}
.iconbtns svg{width:16px;height:16px}

/* phases (goal-list rows) */
.goals{display:flex;flex-direction:column;gap:4px}
.goal{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;background:transparent;width:100%}
.goal:hover{background:var(--bg)}
.goal.sel{border-color:var(--accent);background:var(--accent-soft)}
.goal .ch{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:center}
.goal .tt{font-weight:600;font-size:13px;line-height:1.3}
.goal .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.p-live{background:var(--accent);color:#fff}
.p-up{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.detail{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg);font-size:13px}
.input:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-size:13px;line-height:1.45;resize:vertical}
textarea.code{font-family:var(--f-mono);font-size:11.5px;min-height:90px}
textarea:focus{outline:none;border-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* teams (alliance rows) */
.alli{display:flex;flex-direction:column;gap:4px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.al:hover{background:var(--bg)}
.al.on{border-color:var(--line-strong);background:var(--bg)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;padding:0}
.al input{border:0;background:transparent;font-weight:600;padding:0;min-width:0;width:100%}
.al input:focus{outline:none;border-bottom:1px solid var(--accent)}
.al .pts{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.al .pts small{display:block;color:var(--muted);font-size:11px}
.al .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.al .bar i{display:block;height:100%}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:6px 0 2px}
.swatches button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}

/* key */
.key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;font-size:12px}
.key span{display:flex;gap:7px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key svg{width:22px;height:18px;flex:none}
.keyh{grid-column:1/-1;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.keyh:first-child{margin-top:0}

/* stage */
.stage{position:relative;min-height:0;background:var(--map-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.mapwrap.drawing{cursor:crosshair}
svg#gm-svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;pointer-events:none}
.mapwrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mapwrap.over-item{cursor:move}
.mapwrap.over-handle{cursor:grab}
.mapwrap.claiming{cursor:pointer}
#gm-stage{touch-action:none}
#gm-stage .mapkey .key.editing,#gm-stage .selcard{touch-action:pan-y}
.dtools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;pointer-events:none;z-index:4}
.dgrp{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.16);pointer-events:auto;flex-wrap:wrap;justify-content:center}
.dgrp button{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--fg);cursor:pointer}
.dgrp button:hover{background:var(--bg)}
.dgrp button[aria-pressed="true"]{background:var(--accent);color:#fff}
.dgrp svg{width:16px;height:16px}
.dgrp .sep{width:1px;background:var(--line);margin:3px 2px}
.dgrp .sw{width:20px;height:20px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.dgrp .sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px;background-clip:padding-box}
.dhint{width:100%;text-align:center;font-size:11.5px;color:var(--fg);pointer-events:none}
.dhint span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.hud{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.hud button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:17px;font-weight:600;cursor:pointer}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:100%}
.legend label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:150px;z-index:5}
.tip b{font-size:13px}
.tip .k{color:var(--muted)}
.ptags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ptags .note{margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 9px;font-size:12px;font-weight:600;max-width:100%}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;padding:0}
.chip button:hover{color:var(--danger);background:var(--panel)}
.ptagadd{position:relative}
.ptaglist{position:absolute;left:0;right:0;bottom:calc(100% + 4px);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:3px;display:flex;flex-direction:column;max-height:220px;overflow-y:auto;z-index:8}
.ptaglist button{border:0;background:transparent;text-align:left;border-radius:6px;padding:7px 9px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--fg)}
.ptaglist button:hover,.ptaglist button.on{background:var(--bg)}
.ptaglist small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.imgmodal{position:fixed;inset:0;z-index:2000;background:rgba(6,8,12,.86);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.imgbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--fg);background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px}
.imgbar b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgbtns{display:flex;gap:6px;flex-wrap:wrap}
.imgbtns .btn{min-height:36px}
.imgscroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg)}
.imgscroll img{display:block;width:100%;height:auto;-webkit-touch-callout:default;user-select:auto}
@media (max-width:600px){.imgbar b{flex-basis:100%}.imgbtns{width:100%}.imgbtns .btn{flex:1;justify-content:center}}
.imgnote{margin:0;text-align:center;color:var(--muted);font-size:12.5px}
.startpick{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.spbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spbtns button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:34px;text-align:left}
.spbtns button i{width:12px;height:12px;border-radius:3px;flex:none}
.spbtns button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.spbtns button:last-child{grid-column:1/-1;justify-content:center;color:var(--muted)}
.spbtns button:last-child[aria-pressed="true"]{color:var(--fg)}
.deng{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line-strong);border-radius:10px;padding:12px;background:var(--bg)}
.deng[hidden]{display:none}
.dhead{display:flex;align-items:center;gap:8px}
.dhead b{flex:1;font-size:13.5px}
.deng .note a{color:var(--accent)}
.dlist-pop{top:calc(100% + 4px);bottom:auto}
.dallies{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dallies button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;min-width:0}
.dallies button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dallies button small{color:var(--muted);font-weight:400;font-size:11.5px}
.dallies button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dallies button:disabled{opacity:.45;cursor:default}
.dsearch{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center}
.dplist{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.dprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.dprow:last-child{border-bottom:0}
.dprow input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.dpn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dpn small{font-weight:400;color:var(--muted);font-size:11px}
.dpp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dfoot{display:flex;flex-direction:column;gap:8px}
.dtot{display:flex;align-items:baseline;gap:6px;font-size:13px}
.dtot span{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--fg)}
.lookpick select{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:6px;padding:2px 6px;font:inherit;font-size:12px;margin-left:4px}
.selcard{width:min(320px,100%);background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:12px;display:flex;flex-direction:column;gap:9px;z-index:6}
.selcard .head b{font-size:13px}
.selcard .x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:6px;font-size:16px}
.selcard .x:hover{background:var(--bg);color:var(--fg)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols button{width:20px;height:20px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.cols button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px}
.note{font-size:12px;color:var(--muted)}
.ok{color:var(--accent);font-weight:600;font-size:12px}
.banner{border:1px solid var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:8px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.blstack{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 64px);z-index:3}
.mapkey{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:min(240px,100%);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.mapkey .key{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px;font-size:11.5px}
.mapkey .key svg{width:18px;height:16px}
.mapkey #gm-key{display:flex;flex-direction:column;gap:6px}
.khead{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kbtn{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;cursor:pointer;color:var(--fg)}
.kbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapkey .key.editing{grid-template-columns:1fr;gap:4px;max-height:min(46vh,340px);overflow-y:auto}
.krow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:center}
.krow.off svg,.krow.off .kin{opacity:.4}
.kin{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:3px 6px;font-size:12px;min-width:0;width:100%}
.kin:focus{outline:none;border-color:var(--accent)}
.kvis{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:5px}
.kvis:hover{color:var(--fg);background:var(--bg)}
.mapkey .qnote{grid-column:1/-1;white-space:normal;color:var(--muted);font-size:11px;line-height:1.35;margin-top:3px}
@media (max-width:600px){.mapkey{width:min(210px,100%);padding:6px 8px}.mapkey .key{font-size:11px}}
.rhead{display:flex;flex-direction:column;gap:10px}
.rteam{grid-template-columns:auto minmax(0,1fr) auto auto}
.rx{border:0;background:transparent;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:6px;font-size:15px;line-height:1;padding:0;flex:none}
.rx:hover{background:var(--bg);color:var(--danger)}
.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;color:var(--muted);font-size:12.5px;line-height:1.45}
.rfilters{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:6px}
.rlist{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow-y:auto;margin-inline:-4px;padding-inline:4px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px 24px;gap:4px;align-items:center;border-left:3px solid var(--tc);padding-left:6px;border-radius:2px}
.pin{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:12.5px;min-width:0;width:100%}
.pin:hover{border-color:var(--line)}
.pin:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.pin.pw{font-family:var(--f-mono);font-size:11.5px;text-align:right}
select.pin{border-color:var(--line);background:var(--bg);cursor:pointer;padding:3px 4px}
#gm-rfoot:empty{display:none}
#gm-radd{min-height:110px;font-size:12.5px}
@media (max-width:600px){.dgrp [data-tool] span{display:none}}
/* map column: on desktop it is just the map; on phones the tools sit above it and the editor, key and toggles below it */
.mapcol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.mapcol>.stage{flex:1;min-height:0}
.mtop:empty,.munder:empty{display:none}
.selbar{display:none}
@media (max-width:820px){
  html,body{height:auto}
  #app{height:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  .mapcol{order:-1}
  .mapcol>.stage{flex:none;width:100%;aspect-ratio:1/1.06;height:auto;max-height:66vh;max-height:66svh;min-height:280px}
  .rail{overflow:visible}
  .mtop .dtools{position:static;pointer-events:auto;padding:0;gap:6px}
  .mtop .dgrp{box-shadow:none;width:100%;justify-content:space-between}
  .mtop #gm-tools{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
  .mtop #gm-tools .sep{display:none}
  .mtop #gm-colors{justify-content:center}
  .mtop .dhint{font-size:12px;color:var(--muted)}
  .mtop .dhint span{background:none;border:0;padding:0}
  .munder .blstack{position:static;max-width:100%;align-items:stretch;gap:8px}
  .munder .selcard{width:100%;box-shadow:none}
  .munder .mapkey{width:100%;box-shadow:none}
  .munder .legend{justify-content:flex-start}
  .selbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:6px 6px 6px 12px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .selbar[hidden]{display:none}
  .selbar .nm{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selbar .nm small{font-weight:400;color:var(--muted);margin-left:6px}
  .selbar button{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:8px;min-height:36px;padding:0 10px;font-size:13px;font-weight:600;cursor:pointer}
  .selbar button.danger{color:var(--danger)}
  .stage.busy .selbar,.stage.busy .tip{display:none}
  .stage .hud{bottom:auto;top:8px;right:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* teams section for the saved image */
function teamsImageBlock(W, y0, fg, mu) {
  var teams = R().teams.map(function (t) { return { t: t, ps: R().players.filter(function (p) { return p.team === t.id; }) }; }).filter(function (x) { return x.ps.length; });
  if (!teams.length) return { svg: '', h: 0 };
  var cols = Math.min(4, teams.length), colW = (W - 48) / cols, maxRows = 24, svg = '', y = y0 + 38;
  svg += '<text x="24" y="' + y + '" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.8" fill="' + mu + '">TEAMS</text>';
  y += 18;
  for (var i = 0; i < teams.length; i += cols) {
    var chunk = teams.slice(i, i + cols), rowsH = 0;
    chunk.forEach(function (x, j) {
      var cx = 24 + j * colW, yy = y + 22, pw = x.ps.reduce(function (a, p) { return a + (p.power || 0); }, 0);
      svg += '<rect x="' + cx + '" y="' + (yy - 13) + '" width="14" height="14" rx="7" fill="' + x.t.color + '"/>';
      svg += '<text x="' + (cx + 22) + '" y="' + yy + '" font-family="Geist, Arial, sans-serif" font-size="18" font-weight="700" fill="' + fg + '">' + esc(x.t.name) + '</text>';
      svg += '<text x="' + (cx + 22) + '" y="' + (yy + 20) + '" font-family="Geist, Arial, sans-serif" font-size="13" fill="' + mu + '">' + x.ps.length + (x.ps.length === 1 ? ' player' : ' players') + (pw && st.pngPower !== false ? ' · ' + fmtPower(pw) : '') + '</text>';
      var shown = x.ps.slice(0, maxRows);
      shown.forEach(function (p, k) {
        svg += '<text x="' + (cx + 22) + '" y="' + (yy + 46 + k * 22) + '" font-family="Geist, Arial, sans-serif" font-size="16" fill="' + fg + '">' + esc(p.name) + (p.power != null && st.pngPower !== false ? '<tspan fill="' + mu + '">  ' + fmtPower(p.power) + '</tspan>' : '') + '</text>';
      });
      var extra = x.ps.length - shown.length;
      if (extra > 0) svg += '<text x="' + (cx + 22) + '" y="' + (yy + 46 + shown.length * 22) + '" font-family="Geist, Arial, sans-serif" font-size="15" fill="' + mu + '">+' + extra + ' more</text>';
      rowsH = Math.max(rowsH, 46 + (shown.length + (extra > 0 ? 1 : 0)) * 22 + 10);
    });
    y += rowsH + 10;
  }
  return { svg: svg, h: y - y0 };
}

/* ---------- import players from Deng's Den (top 8 alliances per server, refreshed daily) ---------- */
var DENG_BASE = 'https://raw.githubusercontent.com/zephyrus44/zephyrus44.github.io/deng-alliances/';
var dg = { open: false, index: null, loading: false, err: '', q: '', server: null, data: null, ally: -1, pq: '', sel: {}, team: '' };
function dgFetch(path) { return fetch(DENG_BASE + path, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
function dgDate(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function dgOpen() {
  dg.open = true; renderDeng();
  if (!dg.index && !dg.loading) {
    dg.loading = true; dg.err = ''; renderDeng();
    dgFetch('index.json').then(function (j) { dg.index = j; dg.loading = false; renderDeng(); var i = $('gm-dq'); if (i) i.focus(); })
      .catch(function () { dg.loading = false; dg.err = 'Couldn’t load the Deng’s Den data. Check your connection and try again.'; renderDeng(); });
  }
}
function dgPickServer(n, allyName) {
  dg.server = n; dg.data = null; dg.ally = -1; dg.sel = {}; dg.pq = ''; dg.err = ''; dg.loading = true; renderDeng();
  dgFetch('servers/' + n + '.json').then(function (j) {
    if (dg.server !== n) return;
    dg.data = j; dg.loading = false;
    if (allyName) j.alliances.forEach(function (a, i) { if (a.name === allyName) dgPickAlly(i, true); });
    renderDeng();
  }).catch(function () { dg.loading = false; dg.err = 'Couldn’t load server ' + n + '. Try again.'; renderDeng(); });
}
function dgPickAlly(i, quiet) {
  dg.ally = i; dg.sel = {}; dg.pq = '';
  var a = dg.data && dg.data.alliances[i]; dg.team = '';
  if (!quiet) renderDeng();
}
function dgMatches() {
  var q = dg.q.trim().toLowerCase(), out = [];
  if (!dg.index) return out;
  var servers = Object.keys(dg.index.servers).map(Number).sort(function (a, b) { return a - b; });
  if (!q) return servers.slice(0, 0);
  if (/^\d+$/.test(q)) servers.filter(function (s) { return String(s).indexOf(q) === 0; }).slice(0, 12).forEach(function (s) {
    var al = dg.index.servers[s] || []; out.push({ server: s, label: 'Server ' + s, sub: al.slice(0, 3).map(function (a) { return a.name; }).join(', ') });
  });
  if (q.length >= 2) servers.forEach(function (s) {
    (dg.index.servers[s] || []).forEach(function (a) {
      if (out.length >= 30) return;
      if ((a.name || '').toLowerCase().indexOf(q) >= 0 || (a.tag || '').toLowerCase().indexOf(q) >= 0) out.push({ server: s, ally: a.name, label: (a.tag ? '[' + a.tag + '] ' : '') + a.name, sub: 'Server ' + s + ' · ' + fmtPower(a.power) + ' · ' + a.n + ' players' });
    });
  });
  return out;
}
function dgSelected() {
  var a = dg.data && dg.data.alliances[dg.ally]; if (!a) return [];
  return a.players.filter(function (p) { return dg.sel[p[0]]; });
}
function renderDengList() {
  var a = dg.data && dg.data.alliances[dg.ally], box = $('gm-dlist'); if (!a || !box) return;
  var q = dg.pq.trim().toLowerCase(), inRoster = {};
  R().players.forEach(function (p) { inRoster[p.name.toLowerCase()] = 1; });
  var rows = a.players.filter(function (p) { return !q || p[0].toLowerCase().indexOf(q) >= 0; });

    var id = 'dgp-' + encodeURIComponent(p[0]).replace(/[^a-zA-Z0-9]/g, '_');
    return '<label class="dprow" for="' + id + '"><input type="checkbox" id="' + id + '" data-dgp="' + esc(p[0]) + '"' + (dg.sel[p[0]] ? ' checked' : '') + '><span class="dpn">' + esc(p[0]) + (inRoster[p[0].toLowerCase()] ? ' <small>in roster</small>' : '') + '</span><span class="dpp">' + fmtPower(p[1]) + '</span></label>';

}
function renderDengFoot() {

  var opts = '<option value="">No team</option>' + R().teams.map(function (t) { return '<option value="' + t.id + '"' + (dg.team === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') +
    (a ? '<option value="@new"' + (dg.team === '@new' ? ' selected' : '') + '>New team: ' + esc(a.name) + '</option>' : '');
  f.innerHTML = '<div class="dtot"><b>' + sel.length + '</b> selected<span>' + (sel.length ? fmtPower(tot) + ' total power' : 'Tick players to add them') + '</span></div>' +
    '<div class="row"><select class="input" id="gm-dteam" aria-label="Add to team" style="flex:1;width:auto">' + opts + '</select><button class="btn primary" data-act="dg-add"' + (sel.length ? '' : ' disabled') + '>Add to roster</button></div>';
}
function renderDeng() {
  var el = $('gm-deng'); if (!el) return;
  if (!dg.open) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  var h = '<div class="dhead"><b>Import from Deng’s Den</b>' + (dg.index ? '<span class="note">Updated ' + dgDate(dg.index.taken_at) + '</span>' : '') + '<button class="rx" data-act="dg-close" aria-label="Close import">×</button></div>';
  if (dg.err) h += '<p class="note" style="color:var(--danger)">' + esc(dg.err) + '</p>';
  if (dg.server == null) {
    h += '<div class="ptagadd"><input class="input" id="gm-dq" placeholder="Server number or alliance name" autocomplete="off" value="' + esc(dg.q) + '" aria-label="Find a server or alliance"' + (dg.index ? '' : ' disabled') + '><div class="ptaglist dlist-pop" id="gm-dqlist" hidden></div></div>';
    h += '<p class="note">' + (dg.loading ? 'Loading…' : 'Covers the 8 strongest alliances on every server, with each member’s power. From <a href="https://dengsden.com/avatar/rankings/" target="_blank" rel="noopener">Deng’s Den</a>, refreshed daily.') + '</p>';
    el.innerHTML = h; return;
  }
  h += '<div class="row"><span class="chip">Server ' + dg.server + '<button data-act="dg-unserver" aria-label="Change server">×</button></span></div>';
  if (dg.loading || !dg.data) { el.innerHTML = h + '<p class="note">Loading server ' + dg.server + '…</p>'; return; }
  h += '<div class="dallies">' + dg.data.alliances.map(function (a, i) {
    return '<button data-dga="' + i + '" aria-pressed="' + (dg.ally === i) + '"' + (a.players.length ? '' : ' disabled') + '><span>' + (a.tag ? '<small>[' + esc(a.tag) + ']</small> ' : '') + esc(a.name) + '</span><small>' + fmtPower(a.power) + ' · ' + (a.players.length ? a.players.length + ' players' : 'no list') + '</small></button>';
  }).join('') + '</div>';
  var a = dg.data.alliances[dg.ally];
  if (a) {
    h += '<div class="dsearch"><input class="input" id="gm-dpq" placeholder="Search ' + esc(a.name) + '" autocomplete="off" value="' + esc(dg.pq) + '" aria-label="Search players"><button class="btn ghost" data-act="dg-all">All</button><button class="btn ghost" data-act="dg-none">None</button></div>';
    h += '<div class="dplist" id="gm-dlist"></div><div class="dfoot" id="gm-dfoot"></div>';
  } else h += '<p class="note">Pick an alliance to see its players.</p>';
  el.innerHTML = h;
  if (a) renderDengList();

$('gm-deng').addEventListener('input', function (e) {
  if (e.target.id === 'gm-dq') {
    dg.q = e.target.value; var m = dgMatches(), box = $('gm-dqlist');
    box.innerHTML = m.length ? m.map(function (x, i) { return '<button data-dgs="' + x.server + '"' + (x.ally ? ' data-dgsa="' + esc(x.ally) + '"' : '') + (i === 0 ? ' class="on"' : '') + '><span>' + esc(x.label) + '</span><small>' + esc(x.sub) + '</small></button>'; }).join('') : (dg.q.trim() ? '<button disabled>No server or alliance matches</button>' : '');

$('gm-deng').addEventListener('keydown', function (e) {

$('gm-deng').addEventListener('pointerdown', function (e) { if (e.target.closest('#gm-dqlist')) e.preventDefault(); });
$('gm-deng').addEventListener('change', function (e) {

function refreshPower(btn) {
  var bySrv = {};
  R().players.forEach(function (p) { if (p.src) (bySrv[p.src] = bySrv[p.src] || []).push(p); });
  var srvs = Object.keys(bySrv); if (!srvs.length) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Refreshing\u2026'; }
  Promise.all(srvs.map(function (n) { return dgFetch('servers/' + n + '.json').then(function (j) { return { n: n, j: j }; }, function () { return { n: n, j: null }; }); })).then(function (res) {
    var upd = 0, same = 0, missing = [], failed = 0, when = '';
    var changes = [];
    res.forEach(function (x) {
      if (!x.j) { failed += bySrv[x.n].length; return; }
      when = x.j.taken_at || when;
      var pw = {}; x.j.alliances.forEach(function (a) { a.players.forEach(function (p) { pw[p[0].toLowerCase()] = p[1]; }); });
      bySrv[x.n].forEach(function (p) {
        var v = pw[p.name.toLowerCase()];
        if (v == null) missing.push(p.name);
        else if (v !== p.power) changes.push([p, v]);
        else same++;
      });
    });
    if (changes.length) { commit(); changes.forEach(function (c) { c[0].power = c[1]; }); upd = changes.length; changed(); }
    renderRoster();
    var msg = upd ? 'Updated power for ' + upd + ' player' + (upd === 1 ? '' : 's') : 'Power is already up to date';
    if (when) msg += ' (Deng\u2019s Den, ' + dgDate(when) + ')';
    if (missing.length) msg += '. Not found: ' + missing.slice(0, 3).join(', ') + (missing.length > 3 ? ' +' + (missing.length - 3) : '');
    if (failed) msg += '. Couldn\u2019t reach the data for ' + failed + ' player' + (failed === 1 ? '' : 's') + '.';
    toast(msg);
  });
}
Object.assign(ACTS, { 'r-deng': function () { dgOpen(); renderRoster(); }, 'r-refresh': function (b) { refreshPower(b); } });
